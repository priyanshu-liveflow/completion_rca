# Verify the reviewer, automatically, as soon as a review lands.
#
# Qodo reviews the pull request; this puts each of its findings through the
# code graph and the test suite, then posts back what could actually be
# proven. It runs on `pull_request_review_comment` rather than on `opened`
# because at open time there are no findings yet — firing then would post an
# empty table on every PR and train everyone to ignore the comment.
name: verify-review

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number
        required: true
      fix:
        description: >-
          attempt a proven repair for each confirmed finding. Writes code, so
          it is off unless asked for.
        type: boolean
        default: false

# One run per PR. A reviewer posting six comments in six seconds should not
# start six indexing jobs that race to comment.
concurrency:
  group: verify-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Findings arrive from a bot commenting on the PR. Nothing here needs
    # write access to code, and the token is never handed to the test run.
    permissions:
      contents: read
      pull-requests: write

    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . codegraphcontext

      - name: Index this repo into the code graph
        env:
          CGC_DB_BACKEND: falkordb-remote
          FALKORDB_HOST: localhost
          FALKORDB_PORT: "6379"
        run: |
          cgc index src/main/agentradar
          cgc index tests/agentradar
          cgc index scripts

      # `--fix` is opt-in per run, never automatic on every review. It writes
      # code, and a workflow that silently patches a branch whenever a bot
      # comments is a worse problem than the bugs it fixes. The gate still
      # holds either way: no proven red-to-green, no pull request.
      - name: Verify the review
        id: verify
        env:
          # The model credential stays in the workflow environment. It is
          # never forwarded into the prompt, and `LocalRunner` allowlists the
          # environment it hands to pytest, so it cannot reach executed tests.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CLOUD_PROVIDER: openai_compat
          GH_TOKEN: ${{ github.token }}
          AGENTRADAR_REPO: ${{ github.repository }}
          AGENTRADAR_REPO_KEY: ${{ github.event.repository.name }}
          AGENTRADAR_SOURCE_ROOT: ""
          AGENTRADAR_TEST_ROOT: tests
          FALKORDB_HOST: localhost
          FALKORDB_PORT: "6379"
        run: |
          python scripts/verify_findings.py \
            --pr "${{ github.event.pull_request.number || inputs.pr }}" \
            ${{ inputs.fix == 'true' && '--fix' || '' }} \
            --markdown > verdicts.md
          cat verdicts.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the verdicts on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Edit the existing comment rather than adding one per review round,
          # so the PR carries the current verdict instead of a scroll of stale
          # ones. `--edit-last` no-ops into a create when there is none yet.
          gh pr comment "${{ github.event.pull_request.number || inputs.pr }}" \
            --body-file verdicts.md --edit-last --create-if-none
