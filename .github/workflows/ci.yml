name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agentradar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install agentradar CI tools
        run: uv pip install pydantic pytest pytest-asyncio ruff mypy mcp langchain-openai python-dotenv

      - name: Ruff lint
        run: uv run ruff check src/main/agentradar tests/agentradar

      - name: Ruff format
        run: uv run ruff format --check src/main/agentradar tests/agentradar

      - name: Layering
        run: uv run python scripts/check_layering.py

      - name: Mypy
        run: uv run mypy --strict src/main/agentradar

      - name: Schemas
        run: uv run python scripts/export_schemas.py --check

      # tests/shared covers the LLM providers. Without it here, PR7's entire
      # suite - including the bind_tools regression - never runs in CI.
      - name: Pytest
        run: uv run pytest tests/agentradar tests/shared -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test
        working-directory: apps/web
        run: npm run test

      - name: Build
        working-directory: apps/web
        run: npm run build
