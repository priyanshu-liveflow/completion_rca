[project]
name = "graph-rca"
version = "0.1.0"
description = "Graph-driven root cause analysis — map application logs to a code graph"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "azure-identity>=1.15.0",
    "codegraphcontext>=0.4.11",
    "falkordb>=1.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=0.13.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.5.1",
    "numpy>=1.26.0",
    "scipy>=1.17.1",
    "structlog>=24.1.0",
    "graphviz>=0.20",
]

[project.scripts]
graph-rca = "src.main.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
